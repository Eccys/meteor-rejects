plugins {
	id 'java'
	id 'fabric-loom' version '1.16.3'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

base {
	archivesName = project.archives_base_name
}
version = project.mod_version
group = project.maven_group

repositories {
	mavenLocal()
	mavenCentral()
	flatDir { dirs 'libs' }
	maven { url "https://maven.meteordev.org/"}
	maven { url "https://maven.meteordev.org/snapshots" }
	maven { url "https://maven.seedfinding.com/" }
	maven { url "https://nexus.seedfinding.com/repository/maven-seedfinding/" }
	maven { url 'https://jitpack.io' }
	maven { url 'https://maven.duti.dev/releases' }
}

loom {
	accessWidenerPath = file("src/main/resources/meteor-rejects.accesswidener")
}

configurations {
	// configuration that holds jars to include in the jar
	extraLibs
}

dependencies {
	// This will make it work on most platforms. It automatically chooses the right dependencies at runtime.
	extraLibs('dev.duti.acheong:cubiomes:1.22.3') { transitive = false }
	extraLibs('dev.duti.acheong:cubiomes:1.22.3:linux64') { transitive = false }
	extraLibs('dev.duti.acheong:cubiomes:1.22.3:osx') { transitive = false }
	extraLibs('dev.duti.acheong:cubiomes:1.22.3:windows64') { transitive = false }
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings files('libs/intermediary-named-26.1.2.jar')
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation fileTree(dir: 'libs', include: ['*.jar'], exclude: ['intermediary-named-26.1.2.jar'])
	modCompileOnly files('libs/baritone-meteor-26.1.jar')

	// seed .locate and ore sim
	extraLibs('com.seedfinding:mc_math:1.171.0') { transitive = false }
	extraLibs('com.seedfinding:mc_seed:1.171.2') { transitive = false }
	extraLibs('com.seedfinding:mc_core:1.210.0') { transitive = false }
	extraLibs('com.seedfinding:mc_noise:1.171.1') { transitive = false }
	extraLibs('com.seedfinding:mc_biome:1.171.1') { transitive = false }
	extraLibs('com.seedfinding:mc_terrain:1.171.1') { transitive = false }
	extraLibs('com.seedfinding:mc_feature:1.171.11') { transitive = false }

	// seedcracker api
	implementation (include('com.github.19MisterX98.SeedcrackerX:seedcrackerx-api:2.10.1')) {transitive = false}
//	implementation (include('com.github.19MisterX98.SeedcrackerX:seedcrackerx-api:master-SNAPSHOT')) {transitive = false}

	// Exploit Preventer (optional)
	modCompileOnly("com.nikoverflow:exploit-preventer-api:0.0.1")

	configurations.implementation.extendsFrom(configurations.extraLibs)
}

processResources {
	inputs.property "version", project.version


	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"mc_version": project.minecraft_version,
				"gh_hash": (System.getenv("GITHUB_SHA") ?: "")
	}
}

jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName}" }
	}
	from {
		configurations.extraLibs.collect { it.isDirectory() ? it : zipTree(it) }
	}
}
tasks.withType(Jar).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
	// ensure that the encoding is set to UTF-8, no matter what the system default is
	// this fixes some edge cases with special characters not displaying correctly
	// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
	// If Javadoc is generated, this must be specified in that task too.
	it.options.encoding = "UTF-8"

	// The Minecraft launcher currently installs Java 8 for users, so your mod probably wants to target Java 8 too
	// JDK 9 introduced a new way of specifying this that will make sure no newer classes or methods are used.
	// We'll use that if it's available, but otherwise we'll use the older option.
	def targetVersion = 21
	if (JavaVersion.current().isJava9Compatible()) {
		 it.options.release = targetVersion
	}
}
